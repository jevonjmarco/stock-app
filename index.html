<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Stock Control App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body { font-family: Arial; margin:0; background:#f5f7fb; }
    .container { padding:16px; }

    .tabbar { display:flex; gap:6px; padding:10px; background:#fff; border-bottom:1px solid #ddd; overflow:auto;}
    .tab { padding:8px 12px; border:0; background:#eee; cursor:pointer; border-radius:8px; }
    .tab.active { background:#102033; color:#fff; }

    .tab-panel { display:none; padding:16px; }
    .tab-panel.active { display:block; }

    .card { background:#fff; padding:16px; border-radius:12px; margin-bottom:16px; }

    table { width:100%; border-collapse:collapse; }
    th,td { padding:10px; border-bottom:1px solid #eee; }

    .row-actions { display:flex; gap:6px; }
    button { cursor:pointer; }

    .mini-btn { padding:6px 8px; border-radius:6px; border:0; background:#ddd; }
    .danger-btn { background:#f87171; color:#fff; }

    .primary-btn { background:#102033; color:#fff; padding:8px 12px; border-radius:8px; border:0; }

    .toast {
      position:fixed;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      background:#102033;
      color:#fff;
      padding:10px 14px;
      border-radius:10px;
      opacity:0;
      transition:.2s;
    }

    .toast.show { opacity:1; }

  </style>
</head>

<body>

<div id="tabbar" class="tabbar">
  <button class="tab active" data-tab="dashboardTab">Dashboard</button>
  <button class="tab" data-tab="supplierTab">Supplier</button>
  <button class="tab" data-tab="productTab">Produk</button>
  <button class="tab" data-tab="waTab">Draft WA</button>
</div>

<div class="container">

<!-- DASHBOARD -->
<section id="dashboardTab" class="tab-panel active">
  <div class="card">
    <h2>Dashboard</h2>
    <button id="refreshBtn" class="primary-btn">Refresh</button>

    <p>Supplier: <span id="metricSuppliers">0</span></p>
    <p>Produk: <span id="metricProducts">0</span></p>

    <table>
      <thead>
        <tr>
          <th>Produk</th>
          <th>Supplier</th>
          <th>Stok</th>
        </tr>
      </thead>
      <tbody id="stockTableBody"></tbody>
    </table>
  </div>
</section>

<!-- SUPPLIER -->
<section id="supplierTab" class="tab-panel">
  <div class="card">
    <h2>Tambah Supplier</h2>
    <form id="supplierForm">
      <input name="nama_supplier" placeholder="Nama Supplier" required />
      <input name="no_wa" placeholder="No WA" />
      <button class="primary-btn">Tambah</button>
    </form>
  </div>

  <div class="card">
    <h2>Manage Supplier</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nama</th>
          <th>WA</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="supplierTableBody"></tbody>
    </table>
  </div>
</section>

<!-- PRODUK -->
<section id="productTab" class="tab-panel">
  <div class="card">
    <h2>Tambah Produk</h2>
    <form id="productForm">
      <select name="supplier_id"></select>
      <input name="nama_produk" placeholder="Nama Produk" required />
      <button class="primary-btn">Tambah</button>
    </form>
  </div>

  <div class="card">
    <h2>Manage Produk</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Supplier</th>
          <th>Nama</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="productTableBody"></tbody>
    </table>
  </div>
</section>

<!-- WA -->
<section id="waTab" class="tab-panel">
  <div class="card">
    <h2>Draft WA</h2>
    <button id="loadWaBtn" class="primary-btn">Load Draft</button>
    <div id="waList"></div>
  </div>
</section>

</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>

<script>
document.querySelectorAll('.tab').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'))
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'))
    btn.classList.add('active')
    document.getElementById(btn.dataset.tab).classList.add('active')
  }
})
</script>

</body>
</html>
